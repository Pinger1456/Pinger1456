<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondChain Selector</title><style>html,body{margin:0;height:100%;background:#07111f;color:#eef6ff;font-family:Arial,sans-serif}main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}p{opacity:.75;line-height:1.5}.error{color:#ffbdc4;max-width:720px}button{margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#4ea8ff;color:#fff;font-weight:700;cursor:pointer}</style></head><body><main><div id="loader"><h1>Загрузка модели…</h1><p>Обычно занимает меньше секунды.</p></div></main><script src="chunk-01.js"></script><script src="chunk-02.js"></script><script src="chunk-03.js"></script><script src="chunk-04.js"></script><script src="chunk-05.js"></script><script>(async()=>{const loader=document.getElementById('loader');const fail=m=>loader.innerHTML='<h1>Не удалось открыть модель</h1><p class="error">'+m+'</p>';try{const parts=window.__BOND_CHUNKS||[];if(parts.length!==5||parts.some(x=>!x)){fail('Не все части модели загрузились. Обновите страницу.');return}const b64=parts.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined'){fail('Откройте сайт в актуальной версии Chrome или Edge.');return}const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.startsWith('<!doctype html>')){fail('Файл модели повреждён.');return}document.open();document.write(html);document.close()}catch(e){console.error(e);fail(String(e.message||e))}})();</script></body></html>
