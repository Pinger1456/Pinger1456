<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondChain Selector</title><style>html,body{margin:0;height:100%;background:#07111f;color:#eef6ff;font-family:Arial,sans-serif}main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}p{opacity:.75;line-height:1.5}.error{color:#ffbdc4;max-width:720px}button{margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#4ea8ff;color:#fff;font-weight:700;cursor:pointer}</style></head><body><main><div id="loader"><h1>Загрузка модели…</h1><p>Обычно занимает меньше секунды.</p></div></main><script src="../blockchain-platform-selector/chunk-01.js?v=2"></script><script>(async()=>{const loader=document.getElementById('loader');const fail=(message)=>{loader.innerHTML='<h1>Не удалось открыть модель</h1><p class="error">'+message+'</p><button onclick="location.reload()">Повторить</button>'};try{const b64=(window.__BOND_CHUNKS||[]).join('');if(!b64){fail('Файл модели не загрузился. Проверьте соединение и обновите страницу.');return}if(typeof DecompressionStream==='undefined'){fail('Браузер не поддерживает встроенную распаковку. Откройте сайт в актуальной версии Chrome или Edge.');return}const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('BondChain Selector')){fail('Получен неполный файл модели.');return}document.open();document.write(html);document.close()}catch(error){console.error(error);fail(String(error.message||error))}})();</script></body></html>
